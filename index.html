<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בודק שלב עסק</title>
  <style>
    :root { --bg: #f6f4fb; --card: #fff; --ink: #24124f; --muted: #6b6485; --line: #e3def0;
            --fire: #a83a1d; --build: #7d5a0c; --insp: #1b5e52; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--ink); }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    fieldset { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin: 0 0 16px; padding: 12px 16px; }
    legend { font-weight: 700; padding: 0 6px; }
    .q { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .q:first-of-type { border-top: 0; }
    .opts { display: flex; gap: 10px; }
    .opts label { white-space: nowrap; cursor: pointer; }
    button { font: inherit; background: var(--ink); color: #fff; border: 0; border-radius: 8px; padding: 10px 20px; cursor: pointer; }
    #result { margin-top: 24px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
    #result[hidden] { display: none; }
    .big { font-size: 1.6rem; font-weight: 800; }
    .firefighter { color: var(--fire); } .builder { color: var(--build); } .inspector { color: var(--insp); }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    td, th { text-align: right; padding: 6px 4px; border-top: 1px solid var(--line); }
    .err { color: var(--fire); }
  </style>
</head>
<body>
<main>
  <h1>בודק שלב עסק</h1>
  <p class="lead">20 שאלות, כל אחת מקבלת 1 (כבאי), 2 (בנאי) או 3 (פקח). הציון קובע את שלב העסק ואת השלב בכל תחום.</p>
  <form id="form"></form>
  <button type="submit" form="form">חשב שלב</button>
  <section id="result" hidden aria-live="polite"></section>
</main>
<script type="module">
  import { DOMAINS, STAGES, scoreBusiness } from './src/score.js';

  const form = document.getElementById('form');
  const result = document.getElementById('result');

  form.innerHTML = DOMAINS.map((d) => `
    <fieldset>
      <legend>${d.name}</legend>
      ${d.questions.map((q, i) => `
        <div class="q">
          <span>${q}</span>
          <span class="opts">
            ${[1, 2, 3].map((v) => `<label><input type="radio" name="${d.id}-${i}" value="${v}"> ${v}</label>`).join('')}
          </span>
        </div>`).join('')}
    </fieldset>`).join('');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const answers = {};
    let missing = 0;
    for (const d of DOMAINS) {
      answers[d.id] = d.questions.map((_, i) => {
        const checked = form.querySelector(`input[name="${d.id}-${i}"]:checked`);
        if (!checked) missing++;
        return checked ? Number(checked.value) : 0;
      });
    }
    result.hidden = false;
    if (missing) {
      result.innerHTML = `<p class="err">חסרות ${missing} תשובות.</p>`;
      return;
    }
    const r = scoreBusiness(answers);
    result.innerHTML = `
      <div>ציון ${r.total} מתוך ${r.max}</div>
      <div class="big ${r.stage}">${STAGES[r.stage]}</div>
      <table>
        <tr><th>תחום</th><th>ממוצע</th><th>שלב</th></tr>
        ${r.domains.map((d) => `<tr><td>${d.name}</td><td>${d.average.toFixed(1)}</td><td class="${d.stage}">${STAGES[d.stage]}</td></tr>`).join('')}
      </table>`;
  });
</script>
</body>
</html>
